name: Security checks
on:
  push:
    branches: [main, codex/security-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade pip==26.3 setuptools==84.1.0
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1
      - run: python security/check_secrets.py
      - run: pnpm audit --audit-level=low
      - run: python -m pip_audit --progress-spinner=off
      - run: python -m unittest discover -s backend -p 'test_*.py'
      - run: pnpm exec tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: pnpm build
